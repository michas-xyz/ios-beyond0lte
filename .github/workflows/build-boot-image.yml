name: Build iOS Boot Image (Galaxy S10e)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      board:
        description: "Target Samsung Board"
        required: true
        default: "beyond0lte"
        type: choice
        options:
          - beyond0lte
          - beyond1lte
          - beyond2lte

jobs:
  test:
    name: Run Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run S10e Test Suite
        run: |
          python -m unittest tests.test_b2l_board tests.test_make_board_platform tests.test_memory_profile tests.test_package_boot tests.test_ram_bounds tests.test_extract_firmware

  build-xnu:
    name: Build S10e XNU Mach-O Kernel
    needs: test
    runs-on: macos-latest
    env:
      B2L_BOARD: ${{ github.event.inputs.board || 'beyond0lte' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          brew install llvm ninja meson dos2unix
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Download & Install Apple Kernel Debug Kit (26.5 build 25F71)
        run: |
          curl -L -f -o Kernel_Debug_Kit_26.5_build_25F71.dmg \
            https://github.com/dortania/KdkSupportPkg/releases/download/25F71/Kernel_Debug_Kit_26.5_build_25F71.dmg
          hdiutil attach Kernel_Debug_Kit_26.5_build_25F71.dmg -mountpoint /Volumes/KDK
          for pkg in "/Volumes/KDK"/*.pkg; do
            echo "Installing: $pkg"
            sudo installer -pkg "$pkg" -target / || true
          done
          hdiutil detach /Volumes/KDK
          rm -f Kernel_Debug_Kit_26.5_build_25F71.dmg
          find /Library/Developer/KDKs -name "*.kdk" || true
          echo "KDK installed successfully!"

      - name: Fetch Apple XNU Kernel Source
        run: |
          bash scripts/fetch-xnu.sh xnu

      - name: Prepare XNU with S10e Board Patches & Overlay
        run: |
          bash scripts/prepare-xnu.sh xnu
          echo "#define B2L_BUILD_EPOCH $(date +%s)" > xnu/iokit/Kernel/arm/b2l_build_epoch.h
          touch xnu/iokit/Kernel/arm/B2LPlatformExpert.cpp

      - name: Setup AvailabilityVersions & Dependency Root
        run: |
          export B2L_DEPSROOT="$RUNNER_TEMP/deps"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/os"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/sys"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/firehose"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/os"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/sys"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/firehose"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/mach"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/kern"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/machine"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kernel/vm"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/mach"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/kern"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/machine"
          mkdir -p "$B2L_DEPSROOT/usr/local/include/vm"
          mkdir -p "$B2L_DEPSROOT/usr/local/lib/kernel"
          mkdir -p "$B2L_DEPSROOT/System/Library/Frameworks/Kernel.framework"

          git clone --filter=blob:none https://github.com/apple-oss-distributions/AvailabilityVersions.git $RUNNER_TEMP/AvailabilityVersions
          git -C $RUNNER_TEMP/AvailabilityVersions checkout 149b1777f3e8c2133042d8e188f72e3adf6a7110
          bash tools/b1l/install-availability.sh $RUNNER_TEMP/AvailabilityVersions "$B2L_DEPSROOT"
          test -x "$B2L_DEPSROOT/usr/local/libexec/availability.pl"
          echo "AvailabilityVersions installed successfully!"

      - name: Build S10e ARM64 Generic libfirehose_kernel
        run: |
          export KDKROOT=$(find /Library/Developer/KDKs -name "*.kdk" | head -n 1)
          export B2L_DEPSROOT="$RUNNER_TEMP/deps"
          git clone --filter=blob:none https://github.com/apple-oss-distributions/libdispatch.git $RUNNER_TEMP/libdispatch
          git -C $RUNNER_TEMP/libdispatch checkout 701f4d1a24ae9c6863901bbbb22624b7d1b87321

          # Stage Clang builtin headers (for -nostdinc stdatomic.h, stddef.h, etc.)
          clang_res="$(xcrun clang -print-resource-dir)/include"
          cp -r "$clang_res"/* "$B2L_DEPSROOT/usr/local/include/" 2>/dev/null || true
          cp -r "$clang_res"/* "$B2L_DEPSROOT/usr/local/include/kernel/" 2>/dev/null || true

          # Stage Availability headers into dependency root
          cp -r "$B2L_DEPSROOT/usr/include/"* "$B2L_DEPSROOT/usr/local/include/" 2>/dev/null || true
          cp -r "$B2L_DEPSROOT/usr/include/"* "$B2L_DEPSROOT/usr/local/include/kernel/" 2>/dev/null || true

          # Stage Kernel.framework headers from KDK
          if [ -d "$KDKROOT/System/Library/Frameworks/Kernel.framework/Headers" ]; then
            ln -sf "$KDKROOT/System/Library/Frameworks/Kernel.framework/Headers" "$B2L_DEPSROOT/System/Library/Frameworks/Kernel.framework/Headers"
            ln -sf "$KDKROOT/System/Library/Frameworks/Kernel.framework/PrivateHeaders" "$B2L_DEPSROOT/System/Library/Frameworks/Kernel.framework/PrivateHeaders"
          elif [ -d "$KDKROOT/System/Library/Frameworks/Kernel.framework/Versions/A/Headers" ]; then
            ln -sf "$KDKROOT/System/Library/Frameworks/Kernel.framework/Versions/A/Headers" "$B2L_DEPSROOT/System/Library/Frameworks/Kernel.framework/Headers"
            ln -sf "$KDKROOT/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders" "$B2L_DEPSROOT/System/Library/Frameworks/Kernel.framework/PrivateHeaders"
          fi

          # Stage XNU internal headers into dependency root
          cp -r xnu/libkern/os/* "$B2L_DEPSROOT/usr/local/include/os/" 2>/dev/null || true
          cp -r xnu/bsd/sys/* "$B2L_DEPSROOT/usr/local/include/sys/" 2>/dev/null || true
          cp -r xnu/bsd/sys/firehose* "$B2L_DEPSROOT/usr/local/include/firehose/" 2>/dev/null || true
          cp -r xnu/osfmk/mach/* "$B2L_DEPSROOT/usr/local/include/mach/" 2>/dev/null || true
          cp -r xnu/osfmk/kern/* "$B2L_DEPSROOT/usr/local/include/kern/" 2>/dev/null || true
          cp -r xnu/osfmk/machine/* "$B2L_DEPSROOT/usr/local/include/machine/" 2>/dev/null || true
          cp -r xnu/osfmk/arm/* "$B2L_DEPSROOT/usr/local/include/machine/" 2>/dev/null || true
          cp -r xnu/osfmk/vm/* "$B2L_DEPSROOT/usr/local/include/vm/" 2>/dev/null || true

          # Stage uuid headers
          mkdir -p "$B2L_DEPSROOT/usr/local/include/uuid" "$B2L_DEPSROOT/usr/local/include/kernel/uuid"
          cp -r xnu/bsd/uuid/* "$B2L_DEPSROOT/usr/local/include/uuid/" 2>/dev/null || true
          cp -r xnu/bsd/uuid/* "$B2L_DEPSROOT/usr/local/include/kernel/uuid/" 2>/dev/null || true

          # Stage libkern headers
          mkdir -p "$B2L_DEPSROOT/usr/local/include/libkern" "$B2L_DEPSROOT/usr/local/include/kernel/libkern"
          cp -r xnu/libkern/libkern/* "$B2L_DEPSROOT/usr/local/include/libkern/" 2>/dev/null || true
          cp -r xnu/libkern/libkern/* "$B2L_DEPSROOT/usr/local/include/kernel/libkern/" 2>/dev/null || true

          # Stage libkern firehose headers (firehose_types_private.h, chunk_private.h, tracepoint_private.h)
          mkdir -p "$B2L_DEPSROOT/usr/local/include/firehose" "$B2L_DEPSROOT/usr/local/include/kernel/firehose"
          cp -r xnu/libkern/firehose/* "$B2L_DEPSROOT/usr/local/include/" 2>/dev/null || true
          cp -r xnu/libkern/firehose/* "$B2L_DEPSROOT/usr/local/include/firehose/" 2>/dev/null || true
          cp -r xnu/libkern/firehose/* "$B2L_DEPSROOT/usr/local/include/kernel/" 2>/dev/null || true
          cp -r xnu/libkern/firehose/* "$B2L_DEPSROOT/usr/local/include/kernel/firehose/" 2>/dev/null || true

          # Stage libdispatch os headers (firehose_buffer_private.h)
          if [ -d "$RUNNER_TEMP/libdispatch/os" ]; then
            cp -r "$RUNNER_TEMP/libdispatch/os/"* "$B2L_DEPSROOT/usr/local/include/os/" 2>/dev/null || true
            cp -r "$RUNNER_TEMP/libdispatch/os/"* "$B2L_DEPSROOT/usr/local/include/kernel/os/" 2>/dev/null || true
          fi

          # Mirror internal headers into $B2L_DEPSROOT/usr/local/include/kernel/
          cp -r xnu/libkern/os/* "$B2L_DEPSROOT/usr/local/include/kernel/os/" 2>/dev/null || true
          cp -r xnu/bsd/sys/* "$B2L_DEPSROOT/usr/local/include/kernel/sys/" 2>/dev/null || true
          cp -r xnu/bsd/sys/firehose* "$B2L_DEPSROOT/usr/local/include/kernel/firehose/" 2>/dev/null || true
          cp -r xnu/osfmk/mach/* "$B2L_DEPSROOT/usr/local/include/kernel/mach/" 2>/dev/null || true
          cp -r xnu/osfmk/kern/* "$B2L_DEPSROOT/usr/local/include/kernel/kern/" 2>/dev/null || true
          cp -r xnu/osfmk/machine/* "$B2L_DEPSROOT/usr/local/include/kernel/machine/" 2>/dev/null || true
          cp -r xnu/osfmk/arm/* "$B2L_DEPSROOT/usr/local/include/kernel/machine/" 2>/dev/null || true
          cp -r xnu/osfmk/vm/* "$B2L_DEPSROOT/usr/local/include/kernel/vm/" 2>/dev/null || true

          # Stage libdispatch private headers
          if [ -d "$RUNNER_TEMP/libdispatch/private/firehose" ]; then
            cp -r "$RUNNER_TEMP/libdispatch/private/firehose/"* "$B2L_DEPSROOT/usr/local/include/firehose/" 2>/dev/null || true
            cp -r "$RUNNER_TEMP/libdispatch/private/firehose/"* "$B2L_DEPSROOT/usr/local/include/" 2>/dev/null || true
            cp -r "$RUNNER_TEMP/libdispatch/private/firehose/"* "$B2L_DEPSROOT/usr/local/include/kernel/firehose/" 2>/dev/null || true
            cp -r "$RUNNER_TEMP/libdispatch/private/firehose/"* "$B2L_DEPSROOT/usr/local/include/kernel/" 2>/dev/null || true
          fi
          if [ -d "$RUNNER_TEMP/libdispatch/private/os" ]; then
            cp -r "$RUNNER_TEMP/libdispatch/private/os/"* "$B2L_DEPSROOT/usr/local/include/os/" 2>/dev/null || true
            cp -r "$RUNNER_TEMP/libdispatch/private/os/"* "$B2L_DEPSROOT/usr/local/include/kernel/os/" 2>/dev/null || true
          fi

          export LIBDISPATCH_SRC="$RUNNER_TEMP/libdispatch"
          export XNU_PATH="$GITHUB_WORKSPACE/xnu"
          bash scripts/build-firehose.sh
          test -f "$B2L_DEPSROOT/usr/local/lib/kernel/libfirehose_kernel.a"
          echo "libfirehose_kernel.a built successfully!"

      - name: Build S10e XNU Kernel (mach.development.b2l)
        run: |
          export KDKROOT=$(find /Library/Developer/KDKs -name "*.kdk" | head -n 1)
          export B2L_DEPSROOT="$RUNNER_TEMP/deps"
          export BUILD_DIR="$GITHUB_WORKSPACE/out/xnu"
          export BUILD_JOBS=$(sysctl -n hw.ncpu)
          bash scripts/build-kernel.sh CWARNFLAGS=-w CXXWARNFLAGS=-w

      - name: Verify & Stage Kernel Artifact
        run: |
          mkdir -p out/kernel
          K=$(find out/xnu -name "mach.development.b2l" -type f | head -n 1)
          if [ -z "$K" ]; then
            echo "Error: mach.development.b2l was not found in out/xnu!"
            find out/xnu -maxdepth 4 || true
            exit 1
          fi
          cp "$K" out/kernel/mach.development.b2l
          file out/kernel/mach.development.b2l
          otool -hv out/kernel/mach.development.b2l
          ls -lh out/kernel/

      - name: Upload S10e XNU Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s10e-xnu-kernel
          path: out/kernel/mach.development.b2l

  build-uefi:
    name: Build S10e UEFI Firmware & Boot Image
    needs: test
    runs-on: ubuntu-latest
    env:
      B2L_BOARD: ${{ github.event.inputs.board || 'beyond0lte' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential gcc g++ clang lld llvm uuid-dev bison flex libssl-dev acpica-tools device-tree-compiler dos2unix python3-pip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu nasm rsync

      - name: Clone Mu-Silicium & S10 Reference Overlay
        run: |
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git $HOME/Mu-Silicium
          cd $HOME/Mu-Silicium
          # Silicium-ACPI upstream squashed history, so clone from main directly
          git clone --depth 1 https://github.com/Project-Silicium/Silicium-ACPI.git Silicium-ACPI
          # Initialize all other submodules
          git submodule update --init --recursive --depth 1 Binaries Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
          # Clone and apply beyond2lte-uefi reference overlay
          git clone --depth 1 https://github.com/orhunnx/beyond2lte-uefi.git $HOME/beyond2lte-uefi
          cp -r $HOME/beyond2lte-uefi/mu-silicium-overlay/* $HOME/Mu-Silicium/
          if [ -d "$HOME/beyond2lte-uefi/silicium-acpi-overlay" ]; then
            cp -r $HOME/beyond2lte-uefi/silicium-acpi-overlay/* $HOME/Mu-Silicium/Silicium-ACPI/ || true
          fi

      - name: Configure NASM External Dependency Mock & Platform Packages
        run: |
          for D in "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep" "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Bin/nasm_extdep"; do
            mkdir -p "$D/Linux-x86-64"
            echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
            echo 'version: 20016.1.1' > "$D/Linux-x86-64/extdep_state.yaml"
            ln -sf $(which nasm) "$D/nasm"
            ln -sf $(which nasm) "$D/ndisasm"
            ln -sf $(which nasm) "$D/Linux-x86-64/nasm"
            ln -sf $(which nasm) "$D/Linux-x86-64/ndisasm"
          done

          # Symlink vendor silicon packages so EDK2 can resolve S5E9820Pkg directly at workspace root
          for parent in "$HOME/Mu-Silicium/Silicon/Samsung" "$HOME/Mu-Silicium/Silicon/Silicium"; do
            if [ -d "$parent" ]; then
              for pkg in "$parent"/*; do
                if [ -d "$pkg" ] && [ ! -e "$HOME/Mu-Silicium/$(basename "$pkg")" ]; then
                  ln -sf "$pkg" "$HOME/Mu-Silicium/$(basename "$pkg")"
                fi
              done
            fi
          done

          # Remove OverrideValidation plugin descriptor so non-critical override comment tags do not crash the build
          rm -rf "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Plugin/OverrideValidation"

          # Prune missing library references in S5E9820Pkg.dsc.inc
          python3 -c "from pathlib import Path; import os; [dsc.write_text('\n'.join([f'  # {l.strip()}' if ('|' in l and '.inf' in l and not l.strip().startswith('#') and not (dsc.parent / l.split('|')[1].strip().replace('S5E9820Pkg/', '')).is_file()) else l for l in dsc.read_text().splitlines()]) + '\n') for dsc in Path(os.path.expanduser('~/Mu-Silicium')).glob('**/S5E9820Pkg.dsc.inc')]"

      - name: Generate S10e (beyond0lte) Platform Package
        run: |
          python3 scripts/make-board-platform.py \
            --board beyond0lte \
            --mu $HOME/Mu-Silicium \
            --dtb common/dtb/beyond0lte.dtb
          ln -sf "$HOME/Mu-Silicium/Platforms/Samsung/beyond0ltePkg" "$HOME/Mu-Silicium/beyond0ltePkg"

      - name: Build XnuLoader Application
        run: |
          sudo ln -sf $(which llvm-ar) /usr/bin/llvm-lib || true
          mkdir -p "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Source/C/bin"
          cp -r "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Bin/Linux-x86-64/"* "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Source/C/bin/" 2>/dev/null || true
          make -C "$HOME/Mu-Silicium/Mu_Basecore/BaseTools/Source/C" -j$(nproc) || true

          export WORKSPACE=$HOME/Mu-Silicium
          export CLANG_BIN=/usr/bin/
          export B2L_BOARD=beyond0lte
          bash scripts/build-efi.sh

          test -f "$HOME/Mu-Silicium/Build/B2LXnu/RELEASE_CLANGPDB/AARCH64/XnuLoader.efi"
          echo "XnuLoader.efi built successfully!"

      - name: Embed XnuLoader into S10e Firmware Profile
        run: |
          export B2L_BOARD=beyond0lte
          python3 scripts/prepare-boot-firmware.py \
            --mu $HOME/Mu-Silicium \
            --loader $HOME/Mu-Silicium/Build/B2LXnu/RELEASE_CLANGPDB/AARCH64/XnuLoader.efi \
            --loader-guid 92742D9E-1A4F-42F8-9DC9-53895297B2F4

      - name: Install Python Requirements for Mu-Silicium
        run: |
          cd $HOME/Mu-Silicium
          python3 -m pip install --upgrade -r pip-requirements.txt

      - name: Build S10e UEFI Firmware & Boot Image
        run: |
          cd $HOME/Mu-Silicium
          python3 Platforms/Samsung/beyond0ltePkg/DeviceBuild.py --setup -t RELEASE
          python3 Platforms/Samsung/beyond0ltePkg/DeviceBuild.py --update -t RELEASE
          # Silence unused variable warnings on modern Clang
          find "$HOME/Mu-Silicium" -name "B2LGoster.c" -exec sed -i 's/UINT32                 Parca;/UINT32 Parca __attribute__((unused));/' {} +
          find "$HOME/Mu-Silicium" -name "B2LGoster.c" -exec sed -i 's/Parca++;/\/\/ Parca++;/' {} +
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          export PACKAGES_PATH="$HOME/Mu-Silicium:$HOME/Mu-Silicium/Platforms/Samsung:$HOME/Mu-Silicium/Silicon/Samsung:$HOME/Mu-Silicium/Silicon/Silicium:$HOME/Mu-Silicium/Mu_Basecore:$HOME/Mu-Silicium/Common/Mu:$HOME/Mu-Silicium/Common/Mu_OEM_Sample"
          python3 build_uefi.py -d beyond0lte -r RELEASE

      - name: Prepare Boot Artifacts
        run: |
          mkdir -p out/boot
          cp $HOME/Mu-Silicium/Mu-beyond0lte*.img out/boot/boot.img 2>/dev/null || true
          cp $HOME/Mu-Silicium/Build/beyond0ltePkg/RELEASE_CLANGPDB/FV/*.fd out/boot/ 2>/dev/null || true
          cp $HOME/Mu-Silicium/Build/B2LXnu/RELEASE_CLANGPDB/AARCH64/*.efi out/boot/ 2>/dev/null || true
          ls -la out/boot/

      - name: Upload S10e UEFI Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s10e-uefi-boot-image
          path: out/boot/

  package-boot-image:
    name: Package Complete S10e iOS Boot Image
    needs: [build-xnu, build-uefi]
    runs-on: ubuntu-latest
    env:
      B2L_BOARD: ${{ github.event.inputs.board || 'beyond0lte' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packaging Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm gcc-aarch64-linux-gnu device-tree-compiler

      - name: Clone Mu-Silicium Packaging Tools
        run: |
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git $HOME/Mu-Silicium
          mkdir -p $HOME/Mu-Silicium/Resources/DTBs
          cp common/dtb/beyond0lte.dtb $HOME/Mu-Silicium/Resources/DTBs/beyond0lte.dtb

      - name: Download XNU Kernel Artifact
        uses: actions/download-artifact@v4
        with:
          name: s10e-xnu-kernel
          path: out/kernel

      - name: Download S10e UEFI Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: s10e-uefi-boot-image
          path: out/uefi

      - name: Package Complete Boot Image (UEFI + XNU Trailer)
        run: |
          mkdir -p out/package
          python3 scripts/package-boot.py \
            --mu $HOME/Mu-Silicium \
            --firmware out/uefi/SILICIUM_UEFI.fd \
            --kernel out/kernel/mach.development.b2l \
            --loader out/uefi/XnuLoader.efi \
            --output-dir out/package \
            --max-image-bytes 57671680 \
            --boot-partition-bytes 57671680

          ls -lh out/package/

      - name: Verify Packaged Boot Image
        run: |
          python3 scripts/package-boot.py --verify out/package/boot.img

      - name: Upload Packaged S10e iOS Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: s10e-ios-boot-image
          path: out/package/
